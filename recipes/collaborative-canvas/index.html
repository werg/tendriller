<!doctype html><html lang="en"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Collaborative canvas</title>
<style>body{font:18px system-ui;max-width:42rem;margin:auto;padding:1.5rem}canvas{width:100%;height:22rem;border:2px solid #555;touch-action:none}button{font:inherit;padding:.6rem}</style>
<h1>Collaborative canvas</h1><p>Draw an idea, then send it to the agent. The agent can change the prompt using shared state.</p><p id="prompt"></p>
<canvas id="canvas" width="800" height="440" aria-label="Drawing canvas"></canvas><button id="send">Send drawing</button><button id="clear">Clear</button><p id="status" role="status"></p>
<script>
const canvas=document.querySelector('#canvas'),ctx=canvas.getContext('2d');ctx.lineWidth=4;ctx.lineCap='round';let drawing=false;
function point(e){const r=canvas.getBoundingClientRect();return{x:(e.clientX-r.left)*canvas.width/r.width,y:(e.clientY-r.top)*canvas.height/r.height}}
canvas.onpointerdown=e=>{drawing=true;canvas.setPointerCapture(e.pointerId);const p=point(e);ctx.beginPath();ctx.moveTo(p.x,p.y)};
canvas.onpointermove=e=>{if(!drawing)return;const p=point(e);ctx.lineTo(p.x,p.y);ctx.stroke()};canvas.onpointerup=()=>drawing=false;
document.querySelector('#clear').onclick=()=>ctx.clearRect(0,0,canvas.width,canvas.height);
document.querySelector('#send').onclick=async()=>{const blob=await new Promise(r=>canvas.toBlob(r,'image/png'));const file=await tendril.upload(blob,{name:'drawing.png'});await tendril.send({type:'input',modality:'drawing',blob:file.id,url:file.url,width:canvas.width,height:canvas.height});document.querySelector('#status').textContent='Drawing sent.'};
const show=()=>document.querySelector('#prompt').textContent=tendril.state.get('canvas.prompt')||'What should we sketch together?';tendril.state.on(show);show();
</script></html>
