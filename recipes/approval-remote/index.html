<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="color-scheme" content="light dark">
  <title>Approval remote</title>
  <style>
    :root{font:16px/1.55 system-ui,sans-serif;color:#17372f;background:#f5f7f2;--card:#fff;--muted:#52655c;--line:#dbe4dc;--accent:#176549;--soft:#e9f3ec;--danger:#9c3934}
    *{box-sizing:border-box}body{margin:0}main{max-width:52rem;margin:auto;padding:2.5rem 1.1rem 7rem}header{margin-bottom:1.8rem}.eyebrow{font-size:.78rem;font-weight:750;letter-spacing:.12em;text-transform:uppercase;color:var(--accent)}h1{font-size:clamp(2rem,6vw,3.1rem);line-height:1.12;margin:.55rem 0 1rem;letter-spacing:-.045em}h2{font-size:1.3rem;line-height:1.3;margin:.5rem 0}.intro{max-width:37rem;color:var(--muted)}button,textarea{font:inherit}button{min-height:44px;padding:.65rem 1rem;border:1px solid var(--line);border-radius:.65rem;background:var(--card);color:inherit;cursor:pointer;font-weight:650}button:hover:enabled{border-color:var(--accent)}button:disabled{opacity:.55;cursor:default}button:focus-visible,textarea:focus-visible,summary:focus-visible{outline:3px solid #d8942f;outline-offset:3px}.primary{background:var(--accent);border-color:var(--accent);color:#fff}.reject{color:var(--danger)}nav{display:flex;gap:.55rem;align-items:center;flex-wrap:wrap;margin:1.3rem 0}nav [aria-pressed=true]{background:var(--soft);border-color:var(--accent)}#refresh{margin-left:auto}#connection{font-size:.9rem;color:var(--muted)}#notice{min-height:1.6em;color:var(--danger)}#decisions{display:grid;gap:1rem}.card{background:var(--card);border:1px solid var(--line);border-radius:1rem;padding:1.35rem;box-shadow:0 3px 12px #17372f06}.meta{display:flex;justify-content:space-between;gap:1rem;flex-wrap:wrap;font-size:.83rem;color:var(--muted)}.badge{font-weight:750;color:var(--accent)}.summary{white-space:pre-wrap}.deadline{color:var(--muted);font-size:.85rem}.actions{display:flex;flex-wrap:wrap;gap:.6rem;margin-top:1rem}.revision{margin-top:1.2rem;border-top:1px solid var(--line);padding-top:1rem}.revision label{display:block;font-weight:650;margin-bottom:.4rem}textarea{display:block;width:100%;min-height:5.5rem;padding:.65rem;border:1px solid var(--line);border-radius:.6rem;background:var(--card);color:inherit;resize:vertical}.voice{margin:.6rem 0}.small{color:var(--muted);font-size:.85rem}.result{background:var(--soft);padding:.8rem 1rem;border-radius:.65rem;white-space:pre-wrap}.feedback{min-height:1.6em;margin:.7rem 0 0;color:var(--danger)}pre{white-space:pre-wrap;overflow-wrap:anywhere;font:13px/1.55 ui-monospace,monospace;padding:.85rem;background:var(--soft);border-radius:.65rem}summary{cursor:pointer;padding:.45rem 0}.empty{padding:2rem 1rem;border:1px dashed var(--line);border-radius:1rem;text-align:center;color:var(--muted)}.empty strong{display:block;color:inherit;margin-bottom:.4rem}#update{position:sticky;bottom:1rem;padding:1rem;background:var(--card);border:1px solid var(--line);border-radius:.75rem;box-shadow:0 4px 20px #0002}#update[hidden]{display:none}
    @media(prefers-color-scheme:dark){:root{color:#e0ece5;background:#14221d;--card:#1b2e25;--muted:#a9c1b3;--line:#385044;--accent:#80d8ab;--soft:#233e30;--danger:#ffaaa0}.primary{background:#72ce9e;color:#11261a;border-color:#72ce9e}}
    @media(prefers-reduced-motion:no-preference){button{transition:border-color .12s,background-color .12s}}
  </style>
</head>
<body>
<main>
  <header>
    <div class="eyebrow">Tendriller · Decisions</div>
    <h1>A clear next move.</h1>
    <p class="intro">Review exactly what your agent proposes. Approve a version, decline it, or send a revision. Its progress and result stay on the same card.</p>
    <p id="connection" role="status">Connecting to your agent’s workspace…</p>
  </header>
  <nav aria-label="Decision views">
    <button id="pending-filter" aria-pressed="true">Needs you <span id="pending-count">0</span></button>
    <button id="history-filter" aria-pressed="false">History</button>
    <button id="refresh">Refresh</button>
  </nav>
  <p id="notice" role="status" aria-live="polite"></p>
  <section id="decisions" aria-label="Proposals"></section>
  <aside id="update" hidden><p>A page update is ready. Your revision draft is saved on this device.</p><button id="apply-update">Apply update</button></aside>
<div id="session-tools"></div></main>
<script src="_tendril/snippets/session-archive.js"></script><script src="_tendril/snippets/ptt.js"></script>
<script>
(() => {
  const prefix = (window.__TENDRIL__?.base || location.pathname.replace(/[^/]*$/, '')) + '_tendril/';
  const storageKey = `tendril:${window.__TENDRIL__?.id || 'local'}:approval-drafts`;
  const host = document.querySelector('#decisions'), notice = document.querySelector('#notice');
  let decisions = [], view = 'pending', refreshing = false, refreshAgain = false, deferredUpdate;
  const cards = new Map(), busy = new Set(), feedback = new Map();
  let drafts = {};
  try { drafts = JSON.parse(localStorage.getItem(storageKey) || '{}'); } catch { /* drafts remain usable in memory */ }
  function saveDrafts() { try { localStorage.setItem(storageKey, JSON.stringify(drafts)); } catch { /* sending still works */ } }
  const expired = decision => decision.status === 'expired' || (decision.expires_at != null && decision.expires_at <= Date.now() && decision.status === 'pending');
  const needsYou = decision => decision.status === 'pending' && !expired(decision);
  const text = (tag, value, className) => { const node = document.createElement(tag); if (value != null) node.textContent = String(value); if (className) node.className = className; return node; };
  const labels = { pending: 'Needs your decision', approved: 'Approved · waiting for agent', working: 'Agent is working', rejected: 'Declined', revision_requested: 'Revision requested', completed: 'Completed', failed: 'Could not complete', expired: 'Expired' };
  const isOwner = () => tendril.device.role === 'owner' && !tendril.device.pending;

  async function request(path, options = {}) {
    const response = await fetch(prefix + path, { cache: 'no-store', ...options,
      headers: { ...(options.body ? { 'Content-Type': 'application/json' } : {}), ...(tendril.deviceHeaders?.() || {}), ...(options.headers || {}) } });
    const body = await response.json().catch(() => ({}));
    if (!response.ok) { const error = new Error(body.error?.message || `Could not complete the request (${response.status}).`); error.status = response.status; throw error; }
    return body;
  }

  async function respond(decision, choice, note) {
    if (busy.has(decision.id)) return;
    if (!isOwner()) { feedback.set(decision.id, 'Only the owner can respond to this proposal.'); render(); return; }
    if (!needsYou(decision)) { feedback.set(decision.id, 'This proposal is no longer awaiting a decision. Refresh to review the latest version.'); render(); return; }
    if (choice === 'revise' && !note.trim()) { feedback.set(decision.id, 'Describe the change you want, or dictate it below.'); render(); cards.get(decision.id)?.input?.focus(); return; }
    busy.add(decision.id); feedback.set(decision.id, 'Recording your decision…'); render();
    try {
      const response = await request(`decisions/${encodeURIComponent(decision.id)}/respond`, { method: 'POST',
        body: JSON.stringify({ expected_version: decision.version, decision: choice, ...(note.trim() ? { note: note.trim() } : {}) }) });
      const updated = response.decision || response;
      if (updated.id) decisions = decisions.map(item => item.id === updated.id ? updated : item);
      delete drafts[decision.id]; saveDrafts();
      feedback.set(decision.id, choice === 'approve' ? 'Approval recorded for this exact proposal version. Waiting for the agent’s result.' : choice === 'revise' ? 'Your revision request is with the agent.' : 'The proposal was declined.');
      view = 'history';
    } catch (error) {
      feedback.set(decision.id, error.status === 409 || error.status === 410
        ? 'This proposal changed, expired, or was already answered. Your draft is kept; review the latest card before responding.'
        : `${error.message} Your draft is kept. Refresh to check whether the decision was recorded before trying again.`);
    } finally { busy.delete(decision.id); render(); await refresh(); }
  }

  function makeCard(decision) {
    const card = text('article', null, 'card'); card.dataset.decisionId = decision.id;
    const meta = text('div', null, 'meta'), badge = text('span', '', 'badge');
    meta.append(badge, text('span', `Proposal v${decision.version} · ${decision.id}`));
    const heading = text('h2', decision.title), summary = text('p', decision.summary, 'summary');
    card.append(meta, heading, summary);
    if (decision.proposal != null) {
      const details = document.createElement('details');
      details.append(text('summary', 'Review the exact proposal'), text('pre', typeof decision.proposal === 'string' ? decision.proposal : JSON.stringify(decision.proposal, null, 2)));
      card.append(details);
    }
    const deadline = text('p', '', 'deadline'); card.append(deadline);
    let input, voice;
    const controls = [];
    if (decision.status === 'pending' && isOwner()) {
      const revision = text('div', null, 'revision');
      const label = text('label', 'A note or change to request'); label.htmlFor = `note-${decision.id}`;
      input = document.createElement('textarea'); input.id = label.htmlFor; input.maxLength = 4000; input.placeholder = 'For example: keep the existing title and show me the smaller option.';
      input.value = drafts[decision.id]?.text || '';
      input.oninput = () => { drafts[decision.id] = { text: input.value, version: decision.version }; saveDrafts(); };
      revision.append(label, input);
      if (drafts[decision.id] && drafts[decision.id].version !== decision.version) revision.append(text('p', 'This saved draft was written for an earlier version. Review it against the proposal above.', 'small'));
      const voiceHost = text('div', null, 'voice'); revision.append(voiceHost);
      if (window.tendrilSnippets?.ptt) voice = tendrilSnippets.ptt.mount(voiceHost, { label: 'Dictate a revision', route: false,
        onText: (value, final) => { if (final) { input.value = [input.value.trim(), value.trim()].filter(Boolean).join(' '); input.oninput(); } } });
      revision.append(text('p', 'Dictation fills this draft. Choose a decision below to send it.', 'small'));
      const actions = text('div', null, 'actions');
      for (const [choice, label, style] of [['approve', `Approve v${decision.version}`, 'primary'], ['revise', 'Request revision', ''], ['reject', 'Decline', 'reject']]) {
        const button = text('button', label, style); button.type = 'button'; button.dataset.choice = choice;
        button.onclick = () => void respond(decision, choice, input.value);
        controls.push(button); actions.append(button);
      }
      revision.append(actions); card.append(revision);
    } else if (!isOwner() && decision.status === 'pending') card.append(text('p', 'You can review this proposal. Its owner makes the decision.', 'small'));
    if (decision.result != null) card.append(text('p', typeof decision.result === 'string' ? decision.result : JSON.stringify(decision.result, null, 2), 'result'));
    if (decision.note) card.append(text('p', `Your note: ${decision.note}`, 'small'));
    const message = text('p', '', 'feedback'); message.setAttribute('role', 'status'); card.append(message);
    return { node: card, input, voice, controls, badge, deadline, message, decision,
      signature: JSON.stringify([decision, isOwner()]) };
  }

  function updateCard(card) {
    const decision = card.decision;
    card.badge.textContent = expired(decision) ? 'Expired' : labels[decision.status] || decision.status;
    card.deadline.textContent = decision.expires_at == null ? 'No expiry set.' : expired(decision)
      ? 'The approval window closed. Ask the agent for a fresh proposal.'
      : `Decision deadline: ${new Date(decision.expires_at).toLocaleString()}`;
    card.message.textContent = feedback.get(decision.id) || '';
    for (const control of card.controls) control.disabled = busy.has(decision.id) || !needsYou(decision) || !tendril.connected;
    if (card.input) card.input.disabled = busy.has(decision.id) || !needsYou(decision);
    if (card.voice?.button) card.voice.button.disabled = busy.has(decision.id) || !needsYou(decision) || !tendrilSnippets.ptt.supported();
  }

  function render() {
    document.querySelector('#pending-count').textContent = String(decisions.filter(needsYou).length);
    document.querySelector('#pending-filter').setAttribute('aria-pressed', String(view === 'pending'));
    document.querySelector('#history-filter').setAttribute('aria-pressed', String(view === 'history'));
    const visible = decisions.filter(item => view === 'pending' ? needsYou(item) : !needsYou(item));
    const wanted = new Set(visible.map(item => item.id));
    for (const [id, card] of cards) if (!wanted.has(id)) { card.voice?.destroy(); card.node.remove(); cards.delete(id); }
    host.querySelector('.empty')?.remove();
    let before = host.firstElementChild;
    for (const decision of visible) {
      let card = cards.get(decision.id);
      const signature = JSON.stringify([decision, isOwner()]);
      if (!card || card.signature !== signature) {
        const focused = card?.input === document.activeElement;
        card?.voice?.destroy();
        const replacement = makeCard(decision);
        if (card) { if (before === card.node) before = replacement.node; card.node.replaceWith(replacement.node); }
        card = replacement; cards.set(decision.id, card);
        if (focused && card.input) card.input.focus({ preventScroll: true });
      }
      if (card.node !== before) host.insertBefore(card.node, before);
      before = card.node.nextElementSibling;
      updateCard(card);
    }
    if (!visible.length) {
      const empty = text('div', null, 'empty');
      empty.append(text('strong', view === 'pending' ? 'You’re all caught up.' : 'Your decisions will stay here.'),
        text('span', view === 'pending' ? 'The next proposal from your agent will appear here, with the details you need to decide.' : 'Approvals, revision requests, and the agent’s results appear together.'));
      host.append(empty);
    }
  }

  async function refresh() {
    if (refreshing) { refreshAgain = true; return; }
    refreshing = true;
    try {
      const response = await request('decisions');
      decisions = Array.isArray(response.decisions) ? response.decisions : [];
      notice.textContent = ''; render();
    } catch (error) { notice.textContent = `${error.message} You can keep editing a draft and retry Refresh.`; }
    finally { refreshing = false; if (refreshAgain) { refreshAgain = false; void refresh(); } }
  }
  function connection() {
    document.querySelector('#connection').textContent = tendril.connected ? 'Connected · decisions are checked again when you respond.' : 'Offline · drafts are kept here. Reconnect before making a decision.';
    for (const card of cards.values()) updateCard(card);
  }
  document.querySelector('#pending-filter').onclick = () => { view = 'pending'; render(); };
  document.querySelector('#history-filter').onclick = () => { view = 'history'; render(); };
  document.querySelector('#refresh').onclick = () => void refresh();
  tendril.on('decisions_changed', () => void refresh());
  tendril.on('connect', () => { connection(); void refresh(); });
  tendril.on('disconnect', connection); tendril.on('role', () => render());
  document.addEventListener('visibilitychange', () => { if (document.visibilityState === 'visible') void refresh(); });
  window.addEventListener('tendril:before-reload', event => {
    if (!Object.values(drafts).some(draft => draft.text?.trim())) return;
    event.preventDefault(); saveDrafts(); deferredUpdate = event.detail.apply; document.querySelector('#update').hidden = false;
  });
  document.querySelector('#apply-update').onclick = () => { saveDrafts(); deferredUpdate?.(); };
  const timer = setInterval(() => {
    if ([...cards.values()].some(card => view === 'pending' && expired(card.decision))) render();
    for (const card of cards.values()) updateCard(card);
  }, 1000);
  const poll = setInterval(() => { if (document.visibilityState === 'visible' && tendril.connected) void refresh(); }, 30000);
  window.addEventListener('pagehide', () => { saveDrafts(); clearInterval(timer); clearInterval(poll); for (const card of cards.values()) card.voice?.destroy(); });
  tendrilSnippets.sessionArchive.mount('#session-tools',{scope:'decisions',title:'decision history',guard:()=>busy.size?'Wait for the current decision to finish.':Object.values(drafts).some(draft=>draft.text?.trim())?'Send or clear your revision drafts before archiving.':decisions.some(item=>['approved','working'].includes(item.status))?'Wait for approved work to finish before archiving its history.':null,afterArchive:async()=>{drafts={};saveDrafts();view='pending';await refresh();}});
  connection(); void refresh();
})();
</script>
</body>
</html>
