<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>Tendriller SQL Starter — Shared Inventory</title>
  <style>
    body { font-family: system-ui, -apple-system, sans-serif; max-width: 760px; margin: 1.5rem auto; padding: 0 1rem; line-height: 1.45; color: #1f2328; }
    header { display: flex; justify-content: space-between; align-items: baseline; flex-wrap: wrap; gap: 0.5rem; border-bottom: 1px solid #d0d7de; padding-bottom: 0.75rem; }
    .card { border: 1px solid #d0d7de; border-radius: 10px; padding: 1rem; margin: 1rem 0; background: #fff; }
    table { width: 100%; border-collapse: collapse; margin-top: 0.5rem; }
    th, td { text-align: left; border-bottom: 1px solid #e5e7eb; padding: 0.45rem 0.5rem; }
    form { display: grid; grid-template-columns: repeat(auto-fit, minmax(140px, 1fr)); gap: 0.5rem; align-items: end; }
    label { display: flex; flex-direction: column; font-size: 0.85rem; gap: 0.2rem; }
    input, button { font: inherit; padding: 0.45rem 0.6rem; border: 1px solid #8c959f; border-radius: 6px; }
    button { background: #1f6feb; color: #fff; border-color: #1f6feb; cursor: pointer; }
    button.secondary { background: #f6f8fa; color: #1f2328; border-color: #d0d7de; }
    button:disabled { opacity: 0.55; cursor: not-allowed; }
    .status { font-size: 0.9rem; color: #57606a; }
    .row-actions { display: flex; flex-wrap: wrap; gap: 0.5rem; margin-top: 0.75rem; }
    pre.output { background: #f6f8fa; padding: 0.75rem; border-radius: 6px; overflow: auto; font-size: 0.8rem; }
  </style>
</head>
<body>
  <header>
    <h1>Shared Inventory (SQL)</h1>
    <span id="session-status" class="status">Connecting…</span>
  </header>

  <section id="connection-slot" class="card" hidden></section>

  <main id="app">
    <section class="card">
      <h2>Current Stock (SQL Query View)</h2>
      <p id="revision-label" class="status">Revision: pending</p>
      <table>
        <thead><tr><th>SKU</th><th>Location</th><th>Quantity</th></tr></thead>
        <tbody id="stock-rows"><tr><td colspan="3">Loading SQL state…</td></tr></tbody>
      </table>
      <div class="row-actions">
        <button id="refresh" type="button" class="secondary">Refresh query</button>
      </div>
    </section>

    <section class="card">
      <h2>Guarded Stock Transfer</h2>
      <form id="transfer-form">
        <label>SKU <input id="sku" value="flour" required /></label>
        <label>From <input id="from-loc" value="pantry" required /></label>
        <label>To <input id="to-loc" value="counter" required /></label>
        <label>Quantity <input id="qty" type="number" min="1" value="1" required /></label>
        <label>Operation ID <input id="op-id" placeholder="auto UUID" /></label>
        <button id="submit-transfer" type="submit">Transfer</button>
      </form>
      <p id="operation-status" class="status" role="status"></p>
      <div class="row-actions">
        <button id="inspect-op" type="button" class="secondary">Inspect operation</button>
        <button id="export-checkpoint" type="button" class="secondary">Export encrypted checkpoint</button>
      </div>
      <pre id="result" class="output"></pre>
    </section>

    <div id="diagnostics-slot"></div>
  </main>
  <script type="module" src="./page.mjs"></script>
</body>
</html>
