name: ChatGPT integration

on:
  workflow_call:
    inputs:
      manifest_sha256:
        type: string
        required: true

permissions:
  contents: read

jobs:
  integration:
    name: ChatGPT native and packed-host qualification from public graph
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - run: npm ci
      - uses: actions/download-artifact@v4
        with:
          name: public-packages
          path: dist
      - run: node scripts/deployment-bundle.mjs
        env:
          TENDRILLER_EXPECTED_MANIFEST_SHA256: ${{ inputs.manifest_sha256 }}
      - name: Retain native, packed-host and release import coverage without rebuilding
        run: node scripts/qualify-chatgpt-graph.mjs
        env:
          TENDRILLER_EXPECTED_MANIFEST_SHA256: ${{ inputs.manifest_sha256 }}
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: chatgpt-integration-qualification
          path: .results/chatgpt-graph/
          include-hidden-files: true
          if-no-files-found: ignore
