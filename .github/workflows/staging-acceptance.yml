name: Live staging acceptance

on:
  workflow_dispatch:
  workflow_call:
    inputs:
      manifest_sha256:
        type: string
        required: true

permissions:
  contents: read

concurrency:
  group: tendriller-live-staging-acceptance
  cancel-in-progress: false

jobs:
  readiness:
    if: github.ref == 'refs/heads/master'
    runs-on: ubuntu-24.04
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Verify selected live source and open readiness before fixture work
        run: node scripts/review/preflight.mjs --source-only --origin https://staging.tendriller.dev

  acceptance:
    needs: [readiness]
    runs-on: ubuntu-24.04
    container: mcr.microsoft.com/playwright:v1.65.0-noble@sha256:f6fe3cf9a493670b9a20f33597a807262abb25c40c31839ba4ac1dbc51fe7366
    timeout-minutes: 15
    environment: staging
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - run: git config --global --add safe.directory "$GITHUB_WORKSPACE"
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Install native build tools
        run: |
          apt-get update
          apt-get install --yes --no-install-recommends build-essential python3
      - run: npm ci
      - uses: actions/download-artifact@v4
        if: inputs.manifest_sha256 != ''
        with:
          name: public-packages
          path: dist
      - if: inputs.manifest_sha256 != ''
        run: node scripts/deployment-bundle.mjs
        env:
          TENDRILLER_EXPECTED_MANIFEST_SHA256: ${{ inputs.manifest_sha256 }}
      - if: inputs.manifest_sha256 == ''
        run: node scripts/download-release.mjs
      - name: Install the pinned Chronolog v2 session consumer from the verified release graph
        run: |
          SESSION_ARCHIVE="$PWD/dist/$(node -p "require('./dist/manifest.json').artifacts.find(a => a.role === 'session').file")"
          npm install --prefix "$RUNNER_TEMP/consumer" --ignore-scripts "$SESSION_ARCHIVE"
      - name: Qualify asymmetric SQL startup against the restored engine
        run: |
          export E2E_CHRONOLOG_CONSUMER="$RUNNER_TEMP/consumer"
          node node_modules/@playwright/test/cli.js test --config test/e2e/browser-sql-opening.playwright.config.ts
      - name: Smoke and exercise staging
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
          E2E_MOBILE_MATRIX: '1'
        run: |
          export E2E_CHRONOLOG_CONSUMER="$RUNNER_TEMP/consumer"
          node scripts/check-deployment.mjs https://staging.tendriller.dev
          node scripts/run-staging-acceptance.mjs
