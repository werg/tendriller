name: Live staging acceptance

on:
  workflow_dispatch:
  workflow_call:

permissions:
  contents: read

concurrency:
  group: tendriller-live-staging-acceptance
  cancel-in-progress: false

jobs:
  acceptance:
    runs-on: ubuntu-24.04
    if: github.ref == 'refs/heads/master'
    container: mcr.microsoft.com/playwright:v1.65.0-noble@sha256:f6fe3cf9a493670b9a20f33597a807262abb25c40c31839ba4ac1dbc51fe7366
    timeout-minutes: 25
    environment: staging
    env:
      CHRONOLOG_SHA: 5da4974d609fe099f9e3d50ef44cdb30ed8543de
      EMSDK_VERSION: '4.0.20'
      EMSDK_SHA: e4fe26ef59168ff44f4c23c466e497bf60b3411e
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - run: git config --global --add safe.directory "$GITHUB_WORKSPACE"
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - run: npm ci
      - run: npm run build
      - uses: actions/checkout@v4
        with:
          repository: werg/chronolog-db
          ref: ${{ env.CHRONOLOG_SHA }}
          path: .chronolog-staging
          persist-credentials: false
      - run: git config --global --add safe.directory "$GITHUB_WORKSPACE/.chronolog-staging"
      - uses: pnpm/action-setup@v4
        with:
          package_json_file: .chronolog-staging/package.json
      - uses: actions/cache@v4
        id: wasm
        with:
          path: .chronolog-wasm
          key: chronolog-wasm-v1-${{ runner.os }}-${{ runner.arch }}-${{ env.CHRONOLOG_SHA }}-${{ env.EMSDK_VERSION }}-${{ env.EMSDK_SHA }}
      - name: Install pinned Chronolog dependencies
        working-directory: .chronolog-staging
        run: pnpm install --frozen-lockfile
      - name: Build exact Chronolog WASM engine
        if: steps.wasm.outputs.cache-hit != 'true'
        working-directory: .chronolog-staging
        run: |
          git clone --depth 1 --branch "$EMSDK_VERSION" https://github.com/emscripten-core/emsdk.git "$RUNNER_TEMP/emsdk"
          test "$(git -C "$RUNNER_TEMP/emsdk" rev-parse HEAD)" = "$EMSDK_SHA"
          "$RUNNER_TEMP/emsdk/emsdk" install "$EMSDK_VERSION"
          "$RUNNER_TEMP/emsdk/emsdk" activate "$EMSDK_VERSION"
          node tools/build-wasm-engine.mjs --emsdk "$RUNNER_TEMP/emsdk" --output "$GITHUB_WORKSPACE/.chronolog-wasm"
      - name: Build exact public Chronolog package
        working-directory: .chronolog-staging
        run: |
          node tools/package-peer-session.mjs --sql-native --sql-browser --output "$RUNNER_TEMP/session"
          npm install --prefix "$RUNNER_TEMP/consumer" --ignore-scripts "$RUNNER_TEMP"/session/*.tgz
      - name: Smoke and exercise staging
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
          E2E_MOBILE_MATRIX: '1'
        run: |
          export E2E_CHRONOLOG_CONSUMER="$RUNNER_TEMP/consumer"
          export E2E_CHRONOLOG_WASM="$GITHUB_WORKSPACE/.chronolog-wasm"
          node scripts/check-deployment.mjs https://staging.tendriller.dev
          node scripts/run-staging-acceptance.mjs
