name: Live staging acceptance

on:
  workflow_dispatch:
  workflow_call:

permissions:
  contents: read

concurrency:
  group: tendriller-live-staging-acceptance
  cancel-in-progress: false

jobs:
  acceptance:
    runs-on: ubuntu-24.04
    if: github.ref == 'refs/heads/master'
    timeout-minutes: 35
    environment: staging
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - run: npm ci
      - run: npm run build
      - run: npx playwright install --with-deps chromium webkit
      - uses: actions/checkout@v4
        with:
          repository: werg/chronolog-db
          ref: 5da4974d609fe099f9e3d50ef44cdb30ed8543de
          path: .chronolog-staging
          persist-credentials: false
      - uses: pnpm/action-setup@v4
        with:
          package_json_file: .chronolog-staging/package.json
      - name: Build exact public Chronolog package and engine
        working-directory: .chronolog-staging
        run: |
          pnpm install --frozen-lockfile
          git clone --depth 1 --branch 4.0.20 https://github.com/emscripten-core/emsdk.git "$RUNNER_TEMP/emsdk"
          test "$(git -C "$RUNNER_TEMP/emsdk" rev-parse HEAD)" = e4fe26ef59168ff44f4c23c466e497bf60b3411e
          "$RUNNER_TEMP/emsdk/emsdk" install 4.0.20
          "$RUNNER_TEMP/emsdk/emsdk" activate 4.0.20
          node tools/package-peer-session.mjs --sql-native --sql-browser --output "$RUNNER_TEMP/session"
          node tools/build-wasm-engine.mjs --emsdk "$RUNNER_TEMP/emsdk" --output "$RUNNER_TEMP/wasm"
          npm install --prefix "$RUNNER_TEMP/consumer" --ignore-scripts "$RUNNER_TEMP"/session/*.tgz
      - name: Smoke and exercise staging
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
          E2E_MOBILE_MATRIX: '1'
        run: |
          export E2E_CHRONOLOG_CONSUMER="$RUNNER_TEMP/consumer"
          export E2E_CHRONOLOG_WASM="$RUNNER_TEMP/wasm"
          node scripts/check-deployment.mjs https://staging.tendriller.dev
          node scripts/run-staging-acceptance.mjs
