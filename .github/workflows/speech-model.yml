name: Pinned speech model

on:
  workflow_call:
  workflow_dispatch:
  schedule:
    - cron: "20 5 * * 1"
  push:
    branches: [master]
    paths:
      - "runtime/src/voice/**"
      - "runtime/src/utility/**"
      - "runtime/src/utility.ts"
      - "runtime/src/sensors.ts"
      - "runtime/resources.*"
      - "runtime/test/tts/**"
      - "runtime/test/utility-layout.spec.ts"
      - "server/src/runtime-assets.ts"
      - "contract/voice.d.mts"
      - "contract/index.d.mts"
      - "scripts/e2e-speech-assets.mjs"
      - "scripts/install-runtime-resources.mjs"
      - "scripts/dev.mjs"
      - "scripts/qualify-speech-node.mjs"
      - "scripts/generate-speech-fixture.mjs"
      - "scripts/generate-wake-fixtures.mjs"
      - "scripts/build.mjs"
      - "package.json"
      - "package-lock.json"
      - "test/e2e/real-speech.spec.ts"
      - "test/e2e/local-wake-real.spec.ts"
      - "test/e2e/wake-pipeline-fixture.ts"
      - "test/e2e/speech-fixture.mjs"
      - "test/e2e/speech-real.playwright.config.ts"
      - "test/fixtures/speech/**"
      - ".github/workflows/speech-model.yml"
  pull_request:
    paths:
      - "runtime/src/voice/**"
      - "runtime/src/utility/**"
      - "runtime/src/utility.ts"
      - "runtime/src/sensors.ts"
      - "runtime/resources.*"
      - "runtime/test/tts/**"
      - "runtime/test/utility-layout.spec.ts"
      - "server/src/runtime-assets.ts"
      - "contract/voice.d.mts"
      - "contract/index.d.mts"
      - "scripts/e2e-speech-assets.mjs"
      - "scripts/install-runtime-resources.mjs"
      - "scripts/dev.mjs"
      - "scripts/qualify-speech-node.mjs"
      - "scripts/generate-speech-fixture.mjs"
      - "scripts/generate-wake-fixtures.mjs"
      - "scripts/build.mjs"
      - "package.json"
      - "package-lock.json"
      - "test/e2e/real-speech.spec.ts"
      - "test/e2e/local-wake-real.spec.ts"
      - "test/e2e/wake-pipeline-fixture.ts"
      - "test/e2e/speech-fixture.mjs"
      - "test/e2e/speech-real.playwright.config.ts"
      - "test/fixtures/speech/**"
      - ".github/workflows/speech-model.yml"

permissions:
  contents: read
concurrency:
  group: pinned-speech-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/master' }}

jobs:
  real-model:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - uses: actions/cache@v4
        with:
          path: ~/.cache/tendriller-e2e/speech-4.0.0
          key: ${{ runner.os }}-speech-${{ hashFiles('scripts/e2e-speech-assets.mjs', 'runtime/resources.mjs') }}
      # Cache hits are still SHA-256 verified; an unavailable download fails the
      # job instead of turning a missing real-model check into a passing skip.
      - run: node scripts/e2e-speech-assets.mjs
      - name: Install Playwright browsers and Linux audio output
        run: |
          sudo rm -f /etc/apt/sources.list.d/microsoft-prod.list* /etc/apt/sources.list.d/microsoft-prod.sources*
          npx playwright install --with-deps chromium firefox
          sudo apt-get update
          sudo apt-get install --yes --no-install-recommends pulseaudio pulseaudio-utils
          bash scripts/start-ci-audio.sh
      - name: Verify real bundled voice generation (TTS) in Chromium and Firefox
        run: npm run build && npm run test:tts
      - name: Verify real pinned voice recognition (ASR) and wake word in Chromium and Firefox
        run: npm run test:e2e:speech-real
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: pinned-speech-results
          path: |
            test-results/speech-real/
            test-results/tts/
          include-hidden-files: true
          if-no-files-found: ignore
