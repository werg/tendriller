name: Portable Node primitives and alternative-runtime smoke checks

on:
  workflow_dispatch:
  pull_request:
    paths:
      - 'contract/**'
      - 'session/**'
      - 'tools/**'
      - 'docs/tutorial/**'
      - '.github/workflows/runtime-matrix.yml'
      - 'scripts/test/portable-platform.test.mjs'
      - 'scripts/test/archive-safety.test.mjs'
      - 'scripts/bootstrap/**'
      - 'scripts/tendriller-bootstrap.mjs'

concurrency:
  group: portable-primitives-${{ github.event.pull_request.head.repo.full_name || github.repository }}-${{ github.head_ref || github.ref_name }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  node-matrix:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        node: ['22.15.0', '22', '24']
    runs-on: ${{ matrix.os }}
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      - name: Qualify portable primitives (not SQL, browser, RTC or deployment)
        env:
          NODE_OPTIONS: --max-old-space-size=256
        run: node --test --test-concurrency=1 scripts/test/portable-platform.test.mjs scripts/test/ipc-lock-safety.test.mjs scripts/test/outbox-retention.test.mjs scripts/test/serverless-lifetime.test.mjs
      - name: Standalone copied executable smoke check
        run: node scripts/tendriller-bootstrap.mjs --probe-only

  bun-deno-compatibility:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: oven-sh/setup-bun@v2
      - uses: denoland/setup-deno@v2
      - name: Smoke-test builtin archive and probe imports under Bun
        run: |
          bun -e "import { packTarGz, unpackTarGz } from './contract/archive.mjs'; import { probeCapabilities } from './contract/transport-probe.mjs'; const tgz = packTarGz([{ path: 'a.txt', bytes: 'ok' }]); if (new TextDecoder().decode(unpackTarGz(tgz).get('a.txt')) !== 'ok') process.exit(1); console.log(JSON.stringify(await probeCapabilities()));"
      - name: Smoke-test builtin archive and probe imports under Deno
        run: |
          deno eval "import { packTarGz, unpackTarGz } from './contract/archive.mjs'; import { probeCapabilities } from './contract/transport-probe.mjs'; const tgz = packTarGz([{ path: 'a.txt', bytes: 'ok' }]); if (new TextDecoder().decode(unpackTarGz(tgz).get('a.txt')) !== 'ok') Deno.exit(1); console.log(JSON.stringify(await probeCapabilities()));"
          deno run --allow-read --allow-write --allow-env --allow-sys scripts/tendriller-bootstrap.mjs --probe-only
