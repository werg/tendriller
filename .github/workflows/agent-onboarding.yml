name: Agent onboarding

on:
  workflow_call:
    inputs:
      manifest_sha256:
        type: string
        required: true

permissions:
  contents: read

concurrency:
  group: agent-onboarding-${{ github.ref }}
  cancel-in-progress: true

jobs:
  sql-starter:
    name: Guarded SQL starter from public artifacts
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    env:
      # Same toolchain/cache identity as staging-acceptance.yml.
      EMSDK_VERSION: '4.0.20'
      EMSDK_SHA: e4fe26ef59168ff44f4c23c466e497bf60b3411e
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          path: core
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Read the canonical public session pin
        id: session
        working-directory: core
        run: node scripts/session-pin.mjs
      - uses: actions/checkout@v4
        with:
          repository: werg/chronolog-db
          ref: ${{ steps.session.outputs.source }}
          path: chronolog
          persist-credentials: false
      - run: npm ci
        working-directory: core
      - name: Build the exact native SQL engine for this runner
        id: native-sql
        working-directory: chronolog
        env:
          CHRONOLOG_SHA: ${{ steps.session.outputs.source }}
        run: |
          test "$(git rev-parse HEAD)" = "$CHRONOLOG_SHA"
          corepack pnpm install --frozen-lockfile
          node tools/package-peer-session.mjs --sql-native --output "$RUNNER_TEMP/native-sql-session" > "$RUNNER_TEMP/native-sql-package.jsonl"
          node --input-type=module <<'JS'
          import {readFileSync, appendFileSync} from 'node:fs';
          const result = JSON.parse(readFileSync(process.env.RUNNER_TEMP + '/native-sql-package.jsonl', 'utf8').trim().split('\n').at(-1));
          if (result.dirty !== false || result.source !== process.env.CHRONOLOG_SHA || !result.artifact.startsWith(process.env.RUNNER_TEMP + '/')) throw Error('Native SQL package source/path mismatch');
          appendFileSync(process.env.GITHUB_OUTPUT, `artifact=${result.artifact}\n`);
          JS
      - uses: actions/download-artifact@v4
        with:
          name: public-packages
          path: core/dist
      - run: node scripts/deployment-bundle.mjs
        working-directory: core
        env:
          TENDRILLER_EXPECTED_MANIFEST_SHA256: ${{ inputs.manifest_sha256 }}
      - name: Exercise native SQL initialization, guarded writes and reopen
        working-directory: chronolog
        env:
          SQL_ARCHIVE: ${{ steps.native-sql.outputs.artifact }}
        run: node tools/test-peer-session-sql.mjs --artifact "$SQL_ARCHIVE" --output "$RUNNER_TEMP/native-sql-qualification"
      - name: Qualify the exact browser SQL first-app kit without a native application engine
        working-directory: core
        run: |
          node node_modules/@playwright/test/cli.js install --with-deps chromium
          npm run test:first-app -- --first-app-archive "dist/tendriller-first-app-sql-$(node -p "require('./package.json').version").tgz"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: sql-starter-qualification
          path: |
            core/.results/first-app-sql.json
            ${{ runner.temp }}/native-sql-qualification/report.json
          include-hidden-files: true
          if-no-files-found: ignore
      - uses: actions/cache@v4
        id: wasm
        with:
          path: ${{ runner.temp }}/chronolog-fixture/wasm
          key: chronolog-wasm-v1-${{ runner.os }}-${{ runner.arch }}-${{ steps.session.outputs.source }}-${{ env.EMSDK_VERSION }}-${{ env.EMSDK_SHA }}
      - name: Build exact Chronolog WASM engine for tutorial qualification
        if: steps.wasm.outputs.cache-hit != 'true'
        working-directory: chronolog
        run: |
          git clone --depth 1 --branch "$EMSDK_VERSION" https://github.com/emscripten-core/emsdk.git "$RUNNER_TEMP/emsdk"
          test "$(git -C "$RUNNER_TEMP/emsdk" rev-parse HEAD)" = "$EMSDK_SHA"
          "$RUNNER_TEMP/emsdk/emsdk" install "$EMSDK_VERSION"
          "$RUNNER_TEMP/emsdk/emsdk" activate "$EMSDK_VERSION"
          node tools/build-wasm-engine.mjs --emsdk "$RUNNER_TEMP/emsdk" --output "$RUNNER_TEMP/chronolog-build"
          mkdir -p "$RUNNER_TEMP/chronolog-fixture/wasm"
          cp "$RUNNER_TEMP"/chronolog-build/{manifest.json,sqlite3.mjs,sqlite3.wasm,sqlite3-opfs-async-proxy.js} "$RUNNER_TEMP/chronolog-fixture/wasm/"
      - name: Build matching public native and browser SQL session
        working-directory: chronolog
        env:
          CHRONOLOG_SHA: ${{ steps.session.outputs.source }}
        run: |
          test "$(git rev-parse HEAD)" = "$CHRONOLOG_SHA"
          node tools/package-peer-session.mjs --sql-native --sql-browser --wasm-dir "$RUNNER_TEMP/chronolog-fixture/wasm" --output "$RUNNER_TEMP/chronolog-fixture/session"
      - name: Install the exact SQL consumer and pinned Chromium
        working-directory: core
        run: |
          npm install --prefix "$RUNNER_TEMP/consumer" --ignore-scripts "$RUNNER_TEMP"/chronolog-fixture/session/*.tgz
          node node_modules/@playwright/test/cli.js install --with-deps chromium
      - name: Qualify actual signed SQL tutorial UI, enrollment, replication and checkpoint replay
        working-directory: core
        timeout-minutes: 6
        run: |
          export E2E_CHRONOLOG_CONSUMER="$RUNNER_TEMP/consumer"
          export E2E_CHRONOLOG_WASM="$RUNNER_TEMP/chronolog-fixture/wasm"
          node node_modules/@playwright/test/cli.js test --config test/e2e/browser-sql-opening.playwright.config.ts sql-tutorial.spec.ts
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: sql-tutorial-browser-qualification
          path: core/test-results/e2e
          include-hidden-files: true
          if-no-files-found: ignore
          retention-days: 7
