name: Agent onboarding

on:
  workflow_call:
    inputs:
      manifest_sha256:
        type: string
        required: true

permissions:
  contents: read

concurrency:
  group: agent-onboarding-${{ github.ref }}
  cancel-in-progress: true

jobs:
  sql-starter:
    name: Guarded SQL starter from public artifacts
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          path: core
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Read the canonical public session pin
        id: session
        working-directory: core
        run: node scripts/session-pin.mjs
      - run: npm ci
        working-directory: core
      - uses: actions/download-artifact@v4
        with:
          name: public-packages
          path: core/dist
      - run: node scripts/deployment-bundle.mjs
        working-directory: core
        env:
          TENDRILLER_EXPECTED_MANIFEST_SHA256: ${{ inputs.manifest_sha256 }}
      - name: Install the pinned Chronolog v2 session consumer and Chromium
        working-directory: core
        run: |
          SESSION_ARCHIVE="$PWD/dist/$(node -p "require('./dist/manifest.json').artifacts.find(a => a.role === 'session').file")"
          npm install --prefix "$RUNNER_TEMP/consumer" --ignore-scripts "$SESSION_ARCHIVE"
          node node_modules/@playwright/test/cli.js install --with-deps chromium
      - name: Qualify the exact browser SQL first-app kit (zero native build)
        working-directory: core
        run: npm run test:first-app -- --first-app-archive "dist/tendriller-first-app-sql-$(node -p "require('./package.json').version").tgz"
      - name: Qualify actual signed SQL tutorial UI, enrollment, replication and reopen
        working-directory: core
        timeout-minutes: 6
        run: |
          export E2E_CHRONOLOG_CONSUMER="$RUNNER_TEMP/consumer"
          node node_modules/@playwright/test/cli.js test --config test/e2e/browser-sql-opening.playwright.config.ts sql-tutorial.spec.ts
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: sql-starter-qualification
          path: |
            core/.results/first-app-sql.json
            core/test-results/e2e
          include-hidden-files: true
          if-no-files-found: ignore
          retention-days: 7
