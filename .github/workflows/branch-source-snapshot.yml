name: Temporary Contract 3 branch build and source snapshot
on:
  push:
    branches: [feat/unified-blob-store-contract3]
  workflow_dispatch:
permissions:
  contents: write
jobs:
  branch-check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Generate schemas from the public executable contract
        run: |
          node scripts/contract.mjs --write
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add contract/wire.d.mts contract/v3.json
          if ! git diff --cached --quiet; then
            git commit -m "build(contract): regenerate v3 wire declarations and schema"
            git push origin HEAD:feat/unified-blob-store-contract3
          fi
      - name: Validate contract
        run: npm run test:contract
      - name: Snapshot exact branch source
        if: always()
        run: git archive --format=zip -o branch-source.zip HEAD
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: branch-source
          path: branch-source.zip
          retention-days: 1
