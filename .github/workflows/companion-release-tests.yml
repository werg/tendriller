name: Companion release automation
on:
  pull_request:
    paths:
      - 'scripts/companion-release/**'
      - 'scripts/test/companion-release.test.mjs'
      - 'scripts/test/fixtures/companion-release/**'
      - 'scripts/check-published-release.mjs'
      - '.github/workflows/companion-release-tests.yml'
  push:
    paths:
      - 'scripts/companion-release/**'
      - 'scripts/test/companion-release.test.mjs'
      - 'scripts/test/fixtures/companion-release/**'
      - 'scripts/check-published-release.mjs'
      - '.github/workflows/companion-release-tests.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  protocol:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - run: node --test scripts/test/companion-release.test.mjs scripts/test/published-release.test.mjs
