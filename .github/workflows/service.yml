name: Public service

on:
  push:
    branches: ['**']
  pull_request:
  workflow_dispatch:

concurrency:
  group: public-service-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  check:
    runs-on: ubuntu-latest
    outputs:
      storage_schema: ${{ steps.storage.outputs.revision }}
    strategy:
      fail-fast: false
      matrix:
        node: ["22.15.0", "24"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      - run: npm ci
      - name: Identify required storage schema
        id: storage
        run: echo "revision=$(node scripts/storage-schema.mjs)" >> "$GITHUB_OUTPUT"
      - run: npm run check
      - run: npm run test:pair
      - id: chromium
        if: matrix.node == '24'
        run: npx playwright install --with-deps chromium
      - if: matrix.node == '24'
        run: npm run test:browser
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: browser-failure-traces-node-${{ matrix.node }}
          path: test-results/
          include-hidden-files: true
          if-no-files-found: ignore

  contrib-integration:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run build
      - run: npm run build:service
      - run: npx playwright install --with-deps chromium
      - name: Test the composed service with its pinned public contrib suite
        run: node scripts/test-contrib-integration.mjs
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: contrib-service-failure-traces
          path: test-results/contrib-integration/
          include-hidden-files: true
          if-no-files-found: ignore

  staging:
    if: (github.event_name == 'push' || github.event_name == 'workflow_dispatch') && github.ref == 'refs/heads/master' && vars.STAGING_READY == 'true' && needs.check.outputs.storage_schema != '' && vars.STAGING_STORAGE_SCHEMA == needs.check.outputs.storage_schema
    needs: [check, contrib-integration]
    runs-on: ubuntu-latest
    environment: staging
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run build
      - run: npm run build:service
      - run: node scripts/check-legal.mjs
      - name: Check for a newer master commit
        id: current
        run: |
          remote_sha=$(git ls-remote origin refs/heads/master | cut -f1)
          test -n "$remote_sha"
          if [ "$remote_sha" = "$GITHUB_SHA" ]; then
            echo "current=true" >> "$GITHUB_OUTPUT"
          else
            echo "current=false" >> "$GITHUB_OUTPUT"
          fi
      - if: steps.current.outputs.current == 'true'
        run: npx wrangler d1 migrations apply ACCOUNTS --remote --config server/wrangler.staging.jsonc
      - if: steps.current.outputs.current == 'true'
        run: node scripts/publish-runtime.mjs --config server/wrangler.staging.jsonc
      - if: steps.current.outputs.current == 'true'
        run: npx wrangler deploy --config server/wrangler.staging.jsonc --durable-objects-code-update-mode immediate
      - if: steps.current.outputs.current == 'true'
        run: node scripts/check-deployment.mjs https://staging.tendriller.dev
      - if: steps.current.outputs.current == 'true'
        run: npx wrangler d1 execute ACCOUNTS --remote --config server/wrangler.staging.jsonc --file scripts/open-contract3-cutover.sql

  production:
    if: (github.event_name == 'push' || github.event_name == 'workflow_dispatch') && github.ref == 'refs/heads/master' && vars.PRODUCTION_READY == 'true' && needs.check.outputs.storage_schema != '' && vars.PRODUCTION_STORAGE_SCHEMA == needs.check.outputs.storage_schema
    needs: [check, contrib-integration, staging]
    runs-on: ubuntu-latest
    environment: production
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run build
      - run: npm run build:service
      - run: node scripts/check-legal.mjs
      - name: Check for a newer master commit
        id: current
        run: |
          remote_sha=$(git ls-remote origin refs/heads/master | cut -f1)
          test -n "$remote_sha"
          if [ "$remote_sha" = "$GITHUB_SHA" ]; then
            echo "current=true" >> "$GITHUB_OUTPUT"
          else
            echo "current=false" >> "$GITHUB_OUTPUT"
          fi
      - if: steps.current.outputs.current == 'true'
        run: npx wrangler d1 migrations apply ACCOUNTS --remote --config server/wrangler.production.jsonc
      - if: steps.current.outputs.current == 'true'
        run: node scripts/publish-runtime.mjs --config server/wrangler.production.jsonc
      - if: steps.current.outputs.current == 'true'
        run: npx wrangler deploy --config server/wrangler.production.jsonc --durable-objects-code-update-mode immediate
      - if: steps.current.outputs.current == 'true'
        run: node scripts/check-deployment.mjs https://tendriller.dev
      - if: steps.current.outputs.current == 'true'
        run: npx wrangler d1 execute ACCOUNTS --remote --config server/wrangler.production.jsonc --file scripts/open-contract3-cutover.sql
