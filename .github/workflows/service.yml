name: Public service

on:
  push:
    branches: [master]
    tags: ["v*"]
  pull_request:

concurrency:
  group: public-service-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run check
      - run: npx playwright install --with-deps chromium
      - run: npm run test:browser
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: browser-failure-traces
          path: |
            test-results/
            **/.results/
            **/test-results/
          if-no-files-found: ignore

  staging:
    if: github.event_name == 'push' && github.ref == 'refs/heads/master' && vars.STAGING_READY == 'true'
    needs: check
    runs-on: ubuntu-latest
    environment: staging
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run build
      - run: node scripts/check-legal.mjs
      - run: npx wrangler d1 migrations apply ACCOUNTS --remote --config server/wrangler.staging.jsonc
      - run: npx wrangler deploy --config server/wrangler.staging.jsonc

  production:
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v') && vars.PRODUCTION_READY == 'true'
    needs: check
    runs-on: ubuntu-latest
    environment: production
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run build
      - run: node scripts/check-legal.mjs
      - run: npx wrangler d1 migrations apply ACCOUNTS --remote --config server/wrangler.production.jsonc
      - run: npx wrangler deploy --config server/wrangler.production.jsonc
