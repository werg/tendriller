name: Public service

on:
  push:
    branches: ['**']
  pull_request:
  workflow_dispatch:

concurrency:
  group: public-service-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  check:
    runs-on: ubuntu-latest
    outputs:
      storage_schema: ${{ steps.storage.outputs.revision }}
    strategy:
      fail-fast: false
      matrix:
        node: ["22.15.0", "24"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      - run: npm ci
      - name: Identify required storage schema
        id: storage
        run: echo "revision=$(node scripts/storage-schema.mjs)" >> "$GITHUB_OUTPUT"
      - run: npm run check

  browser:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    container: mcr.microsoft.com/playwright:v1.65.0-noble@sha256:f6fe3cf9a493670b9a20f33597a807262abb25c40c31839ba4ac1dbc51fe7366
    steps:
      - uses: actions/checkout@v4
      - run: git config --global --add safe.directory "$GITHUB_WORKSPACE"
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run test:browser
      - name: Qualify shared and elected application owners in Chromium
        run: npm run test:collaboration:browser
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: collaboration-browser-evidence
          path: .results/collaboration-browser.json
          include-hidden-files: true
          if-no-files-found: ignore
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: browser-failure-traces
          path: test-results/
          include-hidden-files: true
          if-no-files-found: ignore

  native-owner:
    name: Native owner attachment and crash recovery
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run build:artifacts
      - run: npm run test:collaboration:native

  artifacts:
    name: Public package artifacts
    # Retain independently checked package inputs promptly for paired consumers.
    # A newer PR commit may cancel the longer browser matrix; these are CI
    # artifacts; deployments also require the full check, browser and native jobs.
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
        with:
          # Consumers pin a source commit, not GitHub's temporary PR merge ref.
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run build:artifacts
      - run: npm run test:consumer
      - run: npm run release:artifacts
      - uses: actions/upload-artifact@v4
        with:
          name: public-packages
          if-no-files-found: error
          path: |
            dist/tendriller-*.tgz
            dist/chronolog-peer-session-*.tgz
            dist/manifest.json
            dist/composition.json
            dist/provenance.json
            dist/tools-manifest.json
            dist/SHA256SUMS

  staging:
    if: (github.event_name == 'push' || github.event_name == 'workflow_dispatch') && github.ref == 'refs/heads/master' && vars.STAGING_READY == 'true' && needs.check.outputs.storage_schema != '' && vars.STAGING_STORAGE_SCHEMA == needs.check.outputs.storage_schema
    needs: [check, browser, native-owner, artifacts]
    runs-on: ubuntu-latest
    environment: staging
    outputs:
      deployed: ${{ steps.smoke.outputs.deployed }}
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run build:deploy
      - run: node scripts/check-legal.mjs
      - name: Check for a newer master commit
        id: current
        run: |
          remote_sha=$(git ls-remote origin refs/heads/master | cut -f1)
          test -n "$remote_sha"
          if [ "$remote_sha" = "$GITHUB_SHA" ]; then
            echo "current=true" >> "$GITHUB_OUTPUT"
          else
            echo "current=false" >> "$GITHUB_OUTPUT"
          fi
      - if: steps.current.outputs.current == 'true'
        run: npx wrangler d1 migrations apply ACCOUNTS --remote --config server/wrangler.staging.jsonc
      - if: steps.current.outputs.current == 'true'
        run: node scripts/publish-runtime.mjs --config server/wrangler.staging.jsonc
      - if: steps.current.outputs.current == 'true'
        run: npx wrangler deploy --config server/wrangler.staging.jsonc --durable-objects-code-update-mode immediate
      - if: steps.current.outputs.current == 'true'
        id: smoke
        run: |
          node scripts/check-deployment.mjs https://staging.tendriller.dev --assistant
          echo "deployed=true" >> "$GITHUB_OUTPUT"

  staging_acceptance:
    if: needs.staging.outputs.deployed == 'true'
    needs: [staging]
    uses: ./.github/workflows/staging-acceptance.yml
    secrets: inherit

  production:
    if: (github.event_name == 'push' || github.event_name == 'workflow_dispatch') && github.ref == 'refs/heads/master' && vars.PRODUCTION_READY == 'true' && needs.check.outputs.storage_schema != '' && vars.PRODUCTION_STORAGE_SCHEMA == needs.check.outputs.storage_schema
    needs: [check, staging_acceptance, native-owner, artifacts]
    runs-on: ubuntu-latest
    environment: production
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run build:deploy
      - run: node scripts/check-legal.mjs
      - name: Check for a newer master commit
        id: current
        run: |
          remote_sha=$(git ls-remote origin refs/heads/master | cut -f1)
          test -n "$remote_sha"
          if [ "$remote_sha" = "$GITHUB_SHA" ]; then
            echo "current=true" >> "$GITHUB_OUTPUT"
          else
            echo "current=false" >> "$GITHUB_OUTPUT"
          fi
      - if: steps.current.outputs.current == 'true'
        run: npx wrangler d1 migrations apply ACCOUNTS --remote --config server/wrangler.production.jsonc
      - if: steps.current.outputs.current == 'true'
        run: node scripts/publish-runtime.mjs --config server/wrangler.production.jsonc
      - if: steps.current.outputs.current == 'true'
        run: npx wrangler deploy --config server/wrangler.production.jsonc --durable-objects-code-update-mode immediate
      - if: steps.current.outputs.current == 'true'
        run: node scripts/check-deployment.mjs https://tendriller.dev --assistant
