name: Public service

on:
  push:
    branches: ['**']
  pull_request:
  workflow_dispatch:

concurrency:
  group: public-service-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  check:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node: ["22.15.0", "24"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      - run: npm ci
      - run: npm run check
      - id: chromium
        if: matrix.node == '24'
        run: npx playwright install --with-deps chromium
      - if: matrix.node == '24'
        run: npm run test:browser
      - if: always() && matrix.node == '24' && steps.chromium.outcome == 'success'
        run: npm run capture:recipes
      - uses: actions/upload-artifact@v4
        if: always() && matrix.node == '24'
        with:
          name: catalog-previews
          path: test-results/catalog/
          if-no-files-found: ignore
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: browser-failure-traces-node-${{ matrix.node }}
          path: test-results/
          include-hidden-files: true
          if-no-files-found: ignore

  portable:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        browser: [firefox, webkit]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run build
      - run: npx playwright install --with-deps ${{ matrix.browser }}
      - run: npx playwright test --config test/portable/playwright.config.ts --project=${{ matrix.browser }}
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: portable-failure-traces-${{ matrix.browser }}
          path: test-results/portable/
          include-hidden-files: true
          if-no-files-found: ignore

  staging:
    if: (github.event_name == 'push' || github.event_name == 'workflow_dispatch') && github.ref == 'refs/heads/master' && vars.STAGING_READY == 'true'
    needs: [check, portable]
    runs-on: ubuntu-latest
    environment: staging
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run build
      - run: node scripts/check-legal.mjs
      - name: Check for a newer master commit
        id: current
        run: |
          remote_sha=$(git ls-remote origin refs/heads/master | cut -f1)
          test -n "$remote_sha"
          if [ "$remote_sha" = "$GITHUB_SHA" ]; then
            echo "current=true" >> "$GITHUB_OUTPUT"
          else
            echo "current=false" >> "$GITHUB_OUTPUT"
          fi
      - if: steps.current.outputs.current == 'true'
        run: npx wrangler d1 migrations apply ACCOUNTS --remote --config server/wrangler.staging.jsonc
      - if: steps.current.outputs.current == 'true'
        run: npx wrangler deploy --config server/wrangler.staging.jsonc --durable-objects-code-update-mode immediate
      - if: steps.current.outputs.current == 'true'
        run: node scripts/check-deployment.mjs https://staging.tendriller.dev

  production:
    if: (github.event_name == 'push' || github.event_name == 'workflow_dispatch') && github.ref == 'refs/heads/master' && vars.PRODUCTION_READY == 'true'
    needs: staging
    runs-on: ubuntu-latest
    environment: production
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run build
      - run: node scripts/check-legal.mjs
      - name: Check for a newer master commit
        id: current
        run: |
          remote_sha=$(git ls-remote origin refs/heads/master | cut -f1)
          test -n "$remote_sha"
          if [ "$remote_sha" = "$GITHUB_SHA" ]; then
            echo "current=true" >> "$GITHUB_OUTPUT"
          else
            echo "current=false" >> "$GITHUB_OUTPUT"
          fi
      - if: steps.current.outputs.current == 'true'
        run: npx wrangler d1 migrations apply ACCOUNTS --remote --config server/wrangler.production.jsonc
      - if: steps.current.outputs.current == 'true'
        run: npx wrangler deploy --config server/wrangler.production.jsonc --durable-objects-code-update-mode immediate
      - if: steps.current.outputs.current == 'true'
        run: node scripts/check-deployment.mjs https://tendriller.dev
