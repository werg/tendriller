name: Public service

on:
  push:
    branches: ['**']
  pull_request:
  workflow_dispatch:

concurrency:
  # Push and PR events for the same source branch qualify one graph.
  # Keep forks independent, and never interrupt a master promotion.
  group: public-service-${{ github.event.pull_request.head.repo.full_name || github.repository }}-${{ github.head_ref || github.ref_name }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/master' }}

permissions:
  contents: read
  actions: read

jobs:
  check:
    runs-on: ubuntu-latest
    outputs:
      storage_schema: ${{ steps.storage.outputs.revision }}
    strategy:
      fail-fast: false
      matrix:
        node: ["22.15.0"]
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      - run: npm ci
      - name: Identify required storage schema
        id: storage
        run: echo "revision=$(node scripts/storage-schema.mjs)" >> "$GITHUB_OUTPUT"
      - run: npm run check

  browser:
    needs: [artifacts]
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    container: mcr.microsoft.com/playwright:v1.65.0-noble@sha256:f6fe3cf9a493670b9a20f33597a807262abb25c40c31839ba4ac1dbc51fe7366
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - run: git config --global --add safe.directory "$GITHUB_WORKSPACE"
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - uses: actions/download-artifact@v4
        with:
          name: public-packages
          path: dist
      - run: node scripts/deployment-bundle.mjs
        env:
          TENDRILLER_EXPECTED_MANIFEST_SHA256: ${{ needs.artifacts.outputs.manifest_sha256 }}
      - run: npm --prefix tools ci
      - name: Qualify the local host with the exact release artifacts
        run: node scripts/test-dev-host.mjs --artifacts "$GITHUB_WORKSPACE/dist"
      # Actions mounts a temporary home whose owner can differ from the image's
      # active user. Firefox requires its existing home to belong to that user.
      - name: Match temporary home ownership to the container user
        run: chown "$(id -u):$(id -g)" "$HOME"
      - name: Start Linux audio output for real Web Audio tests
        run: |
          apt-get update
          apt-get install --yes --no-install-recommends pulseaudio pulseaudio-utils
          bash scripts/start-ci-audio.sh
      - run: node scripts/test-browser.mjs
      - name: Qualify the exact immutable first-app kit
        run: npm run test:first-app -- --first-app-archive "dist/tendriller-first-app-$(node -p "require('./package.json').version").tgz"
      - name: Qualify the immutable first-app kit without SharedWorker
        env:
          FIRST_APP_NO_SHARED_WORKER: '1'
        run: npm run test:first-app -- --first-app-archive "dist/tendriller-first-app-$(node -p "require('./package.json').version").tgz" --report .results/first-app-elected.json
      - name: Qualify automatic relay fallback when RTC is unavailable
        run: npm run test:first-app -- --first-app-archive "dist/tendriller-first-app-$(node -p "require('./package.json').version").tgz" --transport relay --report .results/first-app-relay.json
      - name: Qualify shared and elected application owners in Chromium
        env:
          TENDRILLER_BROWSER_LIFECYCLE: '1'
        run: xvfb-run -a npm run test:collaboration:browser
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: first-app-qualification
          path: |
            .results/first-app*
            .results/collaboration-browser.json
          include-hidden-files: true
          if-no-files-found: ignore
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: collaboration-browser-evidence
          path: .results/collaboration-browser.json
          include-hidden-files: true
          if-no-files-found: ignore
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: browser-failure-traces
          path: test-results/
          include-hidden-files: true
          if-no-files-found: ignore

  native-owner:
    needs: [artifacts]
    name: Native owner attachment and crash recovery
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - uses: actions/download-artifact@v4
        with:
          name: public-packages
          path: dist
      - run: node scripts/deployment-bundle.mjs
        env:
          TENDRILLER_EXPECTED_MANIFEST_SHA256: ${{ needs.artifacts.outputs.manifest_sha256 }}
      - run: npm --prefix tools ci
      - run: npm run test:collaboration:native

  artifacts:
    name: Public package artifacts
    # Retain independently checked package inputs promptly for paired consumers.
    # A newer PR commit may cancel the longer browser matrix; these are CI
    # artifacts; deployments also require the full check, browser and native jobs.
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      source_commit: ${{ steps.composition.outputs.source_commit }}
      composition_id: ${{ steps.composition.outputs.composition_id }}
      manifest_sha256: ${{ steps.composition.outputs.manifest_sha256 }}
      core_release: ${{ steps.composition.outputs.core_release }}
      runtime_id: ${{ steps.composition.outputs.runtime_id }}
      engine_sha256: ${{ steps.composition.outputs.engine_sha256 }}
      starter_sha256: ${{ steps.composition.outputs.starter_sha256 }}
    steps:
      - uses: actions/checkout@v4
        with:
          # Consumers pin a source commit, not GitHub's temporary PR merge ref.
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run check
      - run: npm run release:artifacts
      - name: Record the exact deployment composition
        id: composition
        run: |
          node --input-type=module <<'JS'
          import {readFileSync, appendFileSync} from 'node:fs';
          import {createHash} from 'node:crypto';
          const manifestBytes = readFileSync('dist/manifest.json');
          const manifest = JSON.parse(manifestBytes);
          const values = {source_commit: manifest.source_commit, composition_id: manifest.composition.id,
            manifest_sha256: createHash('sha256').update(manifestBytes).digest('hex'),
            core_release: manifest.version, runtime_id: manifest.runtime,
            engine_sha256: manifest.artifacts.find(item => item.role === 'engine').sha256,
            starter_sha256: manifest.artifacts.find(item => item.role === 'starter').sha256};
          appendFileSync(process.env.GITHUB_OUTPUT, Object.entries(values).map(([key,value]) => `${key}=${value}\n`).join(''));
          JS
      - uses: actions/upload-artifact@v4
        with:
          name: public-packages
          if-no-files-found: error
          path: |
            dist/tendriller-*.tgz
            dist/tendriller-chatgpt-plugin.zip
            dist/chronolog-peer-session-*.tgz
            dist/manifest.json
            dist/composition.json
            dist/provenance.json
            dist/tools-manifest.json
            dist/SHA256SUMS

  sql-starter:
    needs: [artifacts]
    uses: ./.github/workflows/agent-onboarding.yml
    with:
      manifest_sha256: ${{ needs.artifacts.outputs.manifest_sha256 }}

  network-qualification:
    needs: [artifacts]
    uses: ./.github/workflows/network-qualification.yml
    with:
      source: ${{ github.event.pull_request.head.sha || github.sha }}
      manifest_sha256: ${{ needs.artifacts.outputs.manifest_sha256 }}

  publish:
    if: (github.event_name == 'push' || github.event_name == 'workflow_dispatch') && github.ref == 'refs/heads/master'
    needs: [check, browser, native-owner, sql-starter, network-qualification, artifacts]
    permissions:
      contents: write
    uses: ./.github/workflows/release.yml
    with:
      manifest_sha256: ${{ needs.artifacts.outputs.manifest_sha256 }}

  staging:
    if: (github.event_name == 'push' || github.event_name == 'workflow_dispatch') && github.ref == 'refs/heads/master' && vars.STAGING_READY == 'true' && needs.check.outputs.storage_schema != '' && vars.STAGING_STORAGE_SCHEMA == needs.check.outputs.storage_schema
    needs: [check, browser, native-owner, artifacts, publish]
    runs-on: ubuntu-latest
    environment: staging
    outputs:
      deployed: ${{ steps.smoke.outputs.deployed }}
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
      TENDRILLER_EXPECTED_SOURCE_COMMIT: ${{ needs.artifacts.outputs.source_commit }}
      TENDRILLER_EXPECTED_COMPOSITION_ID: ${{ needs.artifacts.outputs.composition_id }}
      TENDRILLER_EXPECTED_MANIFEST_SHA256: ${{ needs.artifacts.outputs.manifest_sha256 }}
      TENDRILLER_EXPECTED_CORE_RELEASE: ${{ needs.artifacts.outputs.core_release }}
      TENDRILLER_EXPECTED_RUNTIME_ID: ${{ needs.artifacts.outputs.runtime_id }}
      TENDRILLER_EXPECTED_ENGINE_SHA256: ${{ needs.artifacts.outputs.engine_sha256 }}
      TENDRILLER_EXPECTED_STARTER_SHA256: ${{ needs.artifacts.outputs.starter_sha256 }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      # A normal deployed host advertises these public versioned downloads.
      # Keep intentional unpublished branch previews in their separate workflow.
      - name: Require the exact public release before deployment
        run: node scripts/check-published-release.mjs
      - run: npm ci
      - uses: actions/download-artifact@v4
        with:
          name: public-packages
          path: dist
      - run: node scripts/deployment-bundle.mjs
      - run: node scripts/check-deployment-artifacts.mjs
      - run: node scripts/check-legal.mjs
      - name: Check for a newer master commit
        id: current
        run: |
          remote_sha=$(git ls-remote origin refs/heads/master | cut -f1)
          test -n "$remote_sha"
          if [ "$remote_sha" = "$GITHUB_SHA" ]; then
            echo "current=true" >> "$GITHUB_OUTPUT"
          else
            echo "current=false" >> "$GITHUB_OUTPUT"
          fi
      - if: steps.current.outputs.current == 'true'
        run: npx wrangler d1 migrations apply ACCOUNTS --remote --config server/wrangler.staging.jsonc
      - if: steps.current.outputs.current == 'true'
        run: node scripts/publish-runtime.mjs --config server/wrangler.staging.jsonc
      - if: steps.current.outputs.current == 'true'
        run: >-
          npx wrangler deploy --config server/wrangler.staging.jsonc --no-bundle --durable-objects-code-update-mode immediate
          --var "SERVICE_SOURCE_COMMIT:$TENDRILLER_EXPECTED_SOURCE_COMMIT"
          --var "SERVICE_COMPOSITION_ID:$TENDRILLER_EXPECTED_COMPOSITION_ID"
      - if: steps.current.outputs.current == 'true'
        id: smoke
        run: |
          node scripts/check-deployment.mjs https://staging.tendriller.dev --assistant \
            --source-commit "$TENDRILLER_EXPECTED_SOURCE_COMMIT" --composition-id "$TENDRILLER_EXPECTED_COMPOSITION_ID" \
            --core-release "$TENDRILLER_EXPECTED_CORE_RELEASE" --runtime-id "$TENDRILLER_EXPECTED_RUNTIME_ID"
          echo "deployed=true" >> "$GITHUB_OUTPUT"

  staging_acceptance:
    if: needs.staging.outputs.deployed == 'true'
    needs: [staging, artifacts]
    uses: ./.github/workflows/staging-acceptance.yml
    with:
      manifest_sha256: ${{ needs.artifacts.outputs.manifest_sha256 }}
    secrets: inherit

  staging_mcp_qualification:
    if: needs.staging.outputs.deployed == 'true'
    needs: [staging, artifacts]
    uses: ./.github/workflows/plugin-qualification.yml
    with:
      environment: staging
      manifest_sha256: ${{ needs.artifacts.outputs.manifest_sha256 }}
    secrets: inherit

  production:
    if: (github.event_name == 'push' || github.event_name == 'workflow_dispatch') && github.ref == 'refs/heads/master' && vars.PRODUCTION_READY == 'true' && needs.check.outputs.storage_schema != '' && vars.PRODUCTION_STORAGE_SCHEMA == needs.check.outputs.storage_schema
    needs: [check, staging_acceptance, staging_mcp_qualification, native-owner, artifacts, publish]
    runs-on: ubuntu-latest
    environment: production
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
      TENDRILLER_EXPECTED_SOURCE_COMMIT: ${{ needs.artifacts.outputs.source_commit }}
      TENDRILLER_EXPECTED_COMPOSITION_ID: ${{ needs.artifacts.outputs.composition_id }}
      TENDRILLER_EXPECTED_MANIFEST_SHA256: ${{ needs.artifacts.outputs.manifest_sha256 }}
      TENDRILLER_EXPECTED_CORE_RELEASE: ${{ needs.artifacts.outputs.core_release }}
      TENDRILLER_EXPECTED_RUNTIME_ID: ${{ needs.artifacts.outputs.runtime_id }}
      TENDRILLER_EXPECTED_ENGINE_SHA256: ${{ needs.artifacts.outputs.engine_sha256 }}
      TENDRILLER_EXPECTED_STARTER_SHA256: ${{ needs.artifacts.outputs.starter_sha256 }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - name: Require the exact public release before deployment
        run: node scripts/check-published-release.mjs
      - run: npm ci
      - uses: actions/download-artifact@v4
        with:
          name: public-packages
          path: dist
      - run: node scripts/deployment-bundle.mjs
      - run: node scripts/check-deployment-artifacts.mjs
      - run: node scripts/check-legal.mjs
      - name: Check for a newer master commit
        id: current
        run: |
          remote_sha=$(git ls-remote origin refs/heads/master | cut -f1)
          test -n "$remote_sha"
          if [ "$remote_sha" = "$GITHUB_SHA" ]; then
            echo "current=true" >> "$GITHUB_OUTPUT"
          else
            echo "current=false" >> "$GITHUB_OUTPUT"
          fi
      - if: steps.current.outputs.current == 'true'
        run: npx wrangler d1 migrations apply ACCOUNTS --remote --config server/wrangler.production.jsonc
      - if: steps.current.outputs.current == 'true'
        run: node scripts/publish-runtime.mjs --config server/wrangler.production.jsonc
      - if: steps.current.outputs.current == 'true'
        run: >-
          npx wrangler deploy --config server/wrangler.production.jsonc --no-bundle --durable-objects-code-update-mode immediate
          --var "SERVICE_SOURCE_COMMIT:$TENDRILLER_EXPECTED_SOURCE_COMMIT"
          --var "SERVICE_COMPOSITION_ID:$TENDRILLER_EXPECTED_COMPOSITION_ID"
      - if: steps.current.outputs.current == 'true'
        run: >-
          node scripts/check-deployment.mjs https://tendriller.dev --assistant
          --source-commit "$TENDRILLER_EXPECTED_SOURCE_COMMIT" --composition-id "$TENDRILLER_EXPECTED_COMPOSITION_ID"
          --core-release "$TENDRILLER_EXPECTED_CORE_RELEASE" --runtime-id "$TENDRILLER_EXPECTED_RUNTIME_ID"
