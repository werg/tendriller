name: Publish qualified release graph
on:
  workflow_call:
    inputs:
      manifest_sha256:
        type: string
        required: true
permissions:
  contents: read
jobs:
  publish:
    if: github.ref == 'refs/heads/master' && (github.event_name == 'push' || github.event_name == 'workflow_dispatch')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - uses: actions/download-artifact@v4
        with:
          name: public-packages
          path: dist
      - name: Verify the qualified graph before publication
        env:
          TENDRILLER_EXPECTED_MANIFEST_SHA256: ${{ inputs.manifest_sha256 }}
        run: node scripts/deployment-bundle.mjs
      - name: Publish source-qualified immutable assets, manifest last
        env:
          GH_TOKEN: ${{ github.token }}
        run: node scripts/publish-release.mjs refs/heads/master SHA256SUMS
